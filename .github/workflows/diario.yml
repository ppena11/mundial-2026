name: Pronóstico diario

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 08:00 (UTC-4). Cambia el 12 si tu zona difiere.
  workflow_dispatch: {}      # permite también ejecutarlo a mano con un botón

permissions:
  contents: write

concurrency:
  group: mundial-commit       # evita choques al hacer push con el snapshot
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr pipeline completo
        run: python run_all.py
      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pronóstico diario $(date -u +%Y-%m-%d)" || echo "sin cambios"
          git pull --rebase --autostash origin main || true
          git push
