name: Snapshot de cuotas (sharp money)

on:
  schedule:
    - cron: "0 */2 * * *"    # cada 2 horas (UTC). Para ahorrar minutos, cambia a "0 */3 * * *".
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mundial-commit
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar requests
        run: pip install requests
      - name: Guardar snapshot de cuotas
        run: python money_layer.py --snapshot
      - name: Persistir histórico en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot cuotas $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          for i in 1 2 3; do
            git fetch origin main
            git merge -X ours --no-edit origin/main || true
            git push origin HEAD:main && break || sleep 5
          done
